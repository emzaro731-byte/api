services:
  - type: web
    name: veylola-ai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AI_MODEL
        value: gpt-5.6
      - key: GROK_MODEL
        value: grok-4.7
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: VEYLOLA_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "0"
      - key: MUSIC_API_URL
        sync: false
      - key: MUSIC_API_KEY
        sync: false
